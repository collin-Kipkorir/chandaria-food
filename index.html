
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AjiraConnect — Find work. Build your future.</title>

		<!-- Primary SEO -->
		<meta name="description" content="AjiraConnect connects job seekers across Kenya with verified employers. Browse open roles and apply in minutes — no account needed." />
		<meta name="keywords" content="jobs Kenya, careers, recruitment, hiring, internships, AjiraConnect, job board, apply online" />
		<link rel="canonical" href="https://chandaria.lovable.app/" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="AjiraConnect — Find work. Build your future." />
		<meta property="og:description" content="Browse verified job openings across Kenya and apply in minutes — no account needed." />
		<meta property="og:url" content="/" />
		<meta property="og:image" content="/og-image.png" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="AjiraConnect — Find work. Build your future." />
		<meta name="twitter:description" content="Browse verified job openings across Kenya and apply in minutes — no account needed." />
		<meta name="twitter:image" content="/og-image.png" />

		<!-- Mobile / theme -->
		<meta name="theme-color" content="#0b3d2e" />
		<link rel="manifest" href="/site.webmanifest" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
		<link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />

		<!-- Structured data (Organization) -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Organization",
				"name": "AjiraConnect",
				"url": "https://chandaria.lovable.app/",
			"logo": "/favicon.svg",
				"sameAs": [
					"https://www.facebook.com/yourpage",
					"https://www.instagram.com/yourpage",
					"https://twitter.com/yourpage"
				],
				"contactPoint": [{
					"@type": "ContactPoint",
					"telephone": "+254-700-000000",
					"contactType": "customer service",
					"areaServed": "KE"
				}]
			}
		</script>

	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
